[project]
name = "orderflowmap-ibkr"
version = "0.1.0"
description = "Read-only IBKR dual-mode market-data and order-flow workstation"
requires-python = ">=3.11"
dependencies = [
  "ib-async==2.0.1",
  "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
orderflow-ibkr = "orderflow_ibkr.workstation:main"

[tool.setuptools.packages.find]
include = ["orderflow_ibkr*"]
exclude = ["static*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
