[project]
name = "orderflowmap-ibkr"
version = "0.1.0"
description = "IBKR dual-mode realtime radar and executed order-flow workstation"
requires-python = ">=3.11"
dependencies = [
  "ib-async==2.0.1",
  "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
orderflow-ibkr = "orderflow_ibkr.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
