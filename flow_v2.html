OF.VIEWS={formation:['FORMATION','价格怎么走出来'],footprint:['FOOTPRINT','成交发生在哪些价格'],pressure:['PRESSURE','谁在用力，价格有没有被推动'],cvd:['CVD','订单流有没有确认价格'],auction:['AUCTION','市场主要在哪里完成交换'],replay:['REPLAY','事情发生的先后顺序']};const center=document.querySelector('.center'),old=[...center.children],nav=document.createElement('div');nav.className='viewBar';nav.innerHTML='<span class="viewLabel">VIEW</span>'+Object.entries(OF.VIEWS).map(([k,v])=>`<button class="viewBtn ${k==='formation'?'on':''}" data-view="${k}" title="${v[1]}">${v[0]}</button>`).join('')+'<div class="viewRec"><span>RECOMMENDED</span><b id="viewRec">FORMATION</b><em id="viewWhy">先观察价格形成。</em></div><a class="learnLink" href="/learn" target="_blank">教学 ↗</a>';const formation=document.createElement('section');formation.id='view-formation';formation.className='viewPanel formationView on';old.forEach(x=>formation.appendChild(x));const panel=(id,t,s,h)=>{const e=document.createElement('section');e.id='view-'+id;e.className='viewPanel altView';e.innerHTML=`<div class="viewHead"><div><b>${t}</b><span>${s}</span></div><div class="qualityNote" id="${id}Quality"></div></div>${h}`;return e};center.innerHTML='';center.append(nav,formation,panel('footprint','FOOTPRINT STUDY','按价格聚合 Sell@Bid / Buy@Ask / Delta / Imbalance','<div class="studyGrid"><div class="studyMain scroll" id="fpStudy"></div><aside class="studyAside"><h3>它回答什么？</h3><p>哪几个价位发生最大交换？哪边主动成交占优？单边成交是否真的推动价格？</p><div id="fpInsight"></div></aside></div>'),panel('pressure','PRESSURE / ABSORPTION','比较成交压力与价格响应，识别承接、卖压和衰竭','<div class="pressureLayout"><div id="pressureBars"></div><div id="pressureEvidence" class="evidence"></div><div class="zoneBox"><h3>重点价位</h3><div id="pressureZones"></div></div></div>'),panel('cvd','CVD / DELTA','价格和流量要一起看；背离比单独 CVD 更重要','<div class="cvdStudy"><canvas id="cvdStudyCanvas"></canvas><div id="cvdInsight" class="studyCaption"></div></div>'),panel('auction','AUCTION / PROFILE','成交量分布描述 acceptance，不直接预测方向','<div class="auctionGrid"><div id="auctionProfile" class="auctionProfile scroll"></div><aside class="studyAside"><h3>它回答什么？</h3><div id="auctionInsight"></div></aside></div>'),panel('replay','SEQUENCE REPLAY','Footprint 会丢掉顺序；Replay 保留 Pressure → Absorption → Response','<div class="replayWrap"><div class="replayControls"><button id="replayBack" class="btn">◀</button><button id="replayPlay" class="btn">PLAY</button><button id="replayNext" class="btn">▶</button><input id="replaySlider" type="range" min="0" max="0" value="0"><span id="replayPos">0 / 0</span></div><div class="replayGrid"><div class="replayChart"><canvas id="replayCanvas"></canvas></div><div id="replayTape" class="replayTape scroll"></div></div><div id="replayInsight" class="studyCaption"></div></div>'));OF.setView=n=>{if(!OF.VIEWS[n])return;OF.C.view=n;document.querySelectorAll('.viewBtn').forEach(b=>b.classList.toggle('on',b.dataset.view===n));document.querySelectorAll('.viewPanel').forEach(p=>p.classList.toggle('on',p.id==='view-'+n));OF.renderViews();if(n==='formation')setTimeout(()=>OF.fitCharts(),25)};document.querySelectorAll('.viewBtn').forEach(b=>b.onclick=()=>OF.setView(b.dataset.view));OF.recommendView=m=>{if(!m)return['formation','先观察价格形成。'];let ba=+m.bid_absorption||0,oa=+m.offer_absorption||0,se=+m.seller_exhaustion||0,be=+m.buyer_exhaustion||0,act=+m.activity_score||0;if(Math.max(ba,oa)>=70)return['pressure','压力很强但价格响应有限，优先检查吸收。'];if(Math.max(se,be)>=72)return['cvd','一侧成交强度衰减，检查价格/CVD 是否背离。'];if(act>=72&&Math.abs(+m.delta||0)>0)return['footprint','活动与单边成交同时升高，定位成交集中价位。'];return['formation','当前没有单一结构占优，先看价格形成。']};const quality=()=>String(OF.S.status.quality||'').startsWith('TBT_')?'TBT EXECUTED FLOW':'REQMKTDATA PROXY',meter=(v,m)=>m?Math.min(100,Math.abs(v)/m*100):0;OF.renderFpView=()=>{let rows=OF.aggregatePrices(OF.S.selected,300),mx=Math.max(1,...rows.map(r=>r.buy+r.sell+r.unknown));$('fpStudy').innerHTML=`<table class="studyTable"><thead><tr><th>Price</th><th>Sell@Bid</th><th>Buy@Ask</th><th>Delta</th><th>Volume</th><th>Structure</th></tr></thead><tbody>${rows.map(r=>{let v=r.buy+r.sell+r.unknown,d=r.buy-r.sell,imb=r.buy>Math.max(1,r.sell)*3?'BUY IMB':r.sell>Math.max(1,r.buy)*3?'SELL IMB':'—';return `<tr><td class="px">${OF.num(r.price,r.price<1?4:2)}</td><td class="sellCell"><i style="width:${meter(r.sell,mx)}%"></i>${OF.num(r.sell,0)}</td><td class="buyCell"><i style="width:${meter(r.buy,mx)}%"></i>${OF.num(r.buy,0)}</td><td class="${d>=0?'buyTxt':'sellTxt'}">${OF.num(d,0)}</td><td>${OF.num(v,0)}</td><td class="${imb==='BUY IMB'?'buyTxt':imb==='SELL IMB'?'sellTxt':'muted'}">${imb}</td></tr>`}).join('')}</tbody></table>`;let top=[...rows].sort((a,b)=>(b.buy+b.sell+b.unknown)-(a.buy+a.sell+a.unknown)).slice(0,5);$('fpInsight').innerHTML='<div class="insightCard"><b>最大交换价位</b>'+top.map(r=>`<span>${OF.num(r.price,r.price<1?4:2)} · Vol ${OF.num(r.buy+r.sell+r.unknown,0)} · Δ ${OF.num(r.buy-r.sell,0)}</span>`).join('')+'</div><div class="insightCard"><b>注意</b><span>Imbalance 只表示主动成交单边；成交很大但价格不进展时切 Pressure。</span></div>';$('footprintQuality').textContent=quality()};OF.renderPressureView=()=>{let m=OF.latest(OF.S.selected,'metrics');if(!m)return;let buy=+m.buy_volume||0,sell=+m.sell_volume||0,mx=Math.max(1,buy,sell),move=+m.move_bps||0,ba=+m.bid_absorption||0,oa=+m.offer_absorption||0,se=+m.seller_exhaustion||0,be=+m.buyer_exhaustion||0;$('pressureBars').innerHTML=`<div class="pressureRow"><span>AGGRESSIVE BUY</span><div><i class="buyBar" style="width:${buy/mx*100}%"></i></div><b>${OF.num(buy,0)}</b></div><div class="pressureRow"><span>AGGRESSIVE SELL</span><div><i class="sellBar" style="width:${sell/mx*100}%"></i></div><b>${OF.num(sell,0)}</b></div><div class="responseRow"><span>PRICE RESPONSE · 15s</span><b class="${move>0?'up':move<0?'dn':'muted'}">${move>=0?'+':''}${OF.num(move,2)} bps</b></div><div class="pressureScore"><div><span>Bid Abs</span><b class="up">${OF.num(ba,0)}</b></div><div><span>Offer Abs</span><b class="dn">${OF.num(oa,0)}</b></div><div><span>Seller Exh</span><b>${OF.num(se,0)}</b></div><div><span>Buyer Exh</span><b>${OF.num(be,0)}</b></div></div>`;let st=OF.stateOf(m),ev=[];if(ba>=70)ev.push('主动卖很多，但 downside progress 有限 → 成交型承接。');if(oa>=70)ev.push('主动买很多，但 upside progress 有限 → 上方卖压/吸收。');if(se>=70)ev.push('卖方速率衰减 → 原下跌发动机变弱。');if(be>=70)ev.push('买方速率衰减 → 原上涨发动机变弱。');if(!ev.length)ev.push('没有达到强吸收/衰竭阈值，不要强行解释。');$('pressureEvidence').innerHTML=`<h3>CURRENT PROCESS</h3><div class="processName ${st[2]}">${st[0]}</div>${ev.map(x=>`<p>• ${x}</p>`).join('')}<p class="muted">Absorption 是压力与价格响应的关系，不是看到一笔大单。</p>`;let rows=OF.aggregatePrices(OF.S.selected,300),want=ba>=oa?'sell':'buy',zones=[...rows].sort((a,b)=>want==='sell'?b.sell-a.sell:b.buy-a.buy).slice(0,6);$('pressureZones').innerHTML=zones.map(r=>`<div class="zoneRow"><b>${OF.num(r.price,r.price<1?4:2)}</b><span>Sell ${OF.num(r.sell,0)}</span><span>Buy ${OF.num(r.buy,0)}</span><em>Δ ${OF.num(r.buy-r.sell,0)}</em></div>`).join('');$('pressureQuality').textContent=quality()};const setup=id=>{let c=$(id),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,r.width,r.height]},line=(x,p,c,w=1.5)=>{if(p.length<2)return;x.strokeStyle=c;x.lineWidth=w;x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke()};OF.renderCvdView=()=>{let pp=OF.pricePoints(OF.S.selected),mm=OF.S.metrics[OF.S.selected]||[];if(pp.length<2||mm.length<2)return;let[x,w,h]=setup('cvdStudyCanvas'),p=pp.slice(-300),cv=mm.slice(-300),pmin=Math.min(...p.map(z=>z.value)),pmax=Math.max(...p.map(z=>z.value)),cmin=Math.min(...cv.map(z=>+z.cvd||0)),cmax=Math.max(...cv.map(z=>+z.cvd||0)),map=(v,a,b,t,bot)=>bot-(v-a)/Math.max(1e-9,b-a)*(bot-t);x.clearRect(0,0,w,h);line(x,p.map((z,i)=>[i/Math.max(1,p.length-1)*w,map(z.value,pmin,pmax,20,h*.45)]),'#ddd',2);line(x,cv.map((z,i)=>[i/Math.max(1,cv.length-1)*w,map(+z.cvd||0,cmin,cmax,h*.58,h-22)]),'#66c7e8',2);x.fillStyle='#aaa';x.fillText('PRICE',8,14);x.fillStyle='#66c7e8';x.fillText('CVD',8,h*.56);let pm=p.at(-1).value-p[0].value,cm=(+cv.at(-1).cvd||0)-(+cv[0].cvd||0),text='价格与 CVD 同向：订单流正在确认当前方向。',cl='';if(pm>=0&&cm<0){text='价格抗跌/走高但 CVD 下降：正向背离候选，检查 Bid Absorption。';cl='up'}else if(pm<=0&&cm>0){text='价格涨不动/走低但 CVD 上升：负向背离候选，检查 Offer Absorption。';cl='dn'}$('cvdInsight').innerHTML=`<b class="${cl}">${text}</b><span>Price Δ ${OF.num(pm,2)} · CVD Δ ${OF.num(cm,0)}</span>`;$('cvdQuality').textContent=quality()};OF.renderAuctionView=()=>{let rows=OF.aggregatePrices(OF.S.selected,+OF.C.historySec);if(!rows.length)return;let mx=Math.max(1,...rows.map(r=>r.buy+r.sell+r.unknown)),poc=[...rows].sort((a,b)=>(b.buy+b.sell+b.unknown)-(a.buy+a.sell+a.unknown))[0],last=OF.latest(OF.S.selected,'trades')||OF.latest(OF.S.selected,'quotes'),lp=+(last?.price||last?.last||0);$('auctionProfile').innerHTML=rows.map(r=>{let v=r.buy+r.sell+r.unknown,bu=v?r.buy/v:0,se=v?r.sell/v:0;return `<div class="auctionRow ${r===poc?'poc':''}"><b>${OF.num(r.price,r.price<1?4:2)}</b><div class="splitProfile"><i class="sellFill" style="width:${v/mx*se*100}%"></i><i class="buyFill" style="width:${v/mx*bu*100}%"></i></div><span>${OF.num(v,0)}</span>${r===poc?'<em>POC</em>':''}</div>`}).join('');let dist=lp&&poc.price?(lp-poc.price)/poc.price*10000:0;$('auctionInsight').innerHTML=`<div class="insightCard"><b>POC / 最大成交节点</b><span>${OF.num(poc.price,poc.price<1?4:2)} · Vol ${OF.num(poc.buy+poc.sell+poc.unknown,0)}</span></div><div class="insightCard"><b>当前价相对 POC</b><span>${dist>=0?'上方':'下方'} ${OF.num(Math.abs(dist),1)} bps</span></div><div class="insightCard"><b>读法</b><span>Profile 代表 acceptance；突破真假仍要回到 Footprint/CVD。</span></div>`;$('auctionQuality').textContent=quality()};OF.replayIndex=0;OF.replayTimer=null;OF.renderReplayView=()=>{let a=OF.S.trades[OF.S.selected]||[],sl=$('replaySlider');if(!a.length){$('replayTape').innerHTML='<div class="pad muted">No trades</div>';return}sl.max=String(a.length-1);OF.replayIndex=Math.min(a.length-1,Math.max(0,OF.replayIndex||a.length-1));sl.value=String(OF.replayIndex);$('replayPos').textContent=`${OF.replayIndex+1} / ${a.length}`;let vis=a.slice(Math.max(0,OF.replayIndex-240),OF.replayIndex+1),tail=vis.slice(-18).reverse();$('replayTape').innerHTML=tail.map(t=>`<div class="replayEvent ${t.aggressor==='BUY'?'buyTxt':t.aggressor==='SELL'?'sellTxt':''}"><span>${OF.clock(t.ts_ns)}</span><b>${OF.num(t.price)}</b><em>${OF.num(t.size,0)} ${t.aggressor||'?'}</em></div>`).join('');let[x,w,h]=setup('replayCanvas'),ps=vis.map(z=>+z.price).filter(Number.isFinite),mn=Math.min(...ps),mx=Math.max(...ps),xy=(i,p)=>[20+i/Math.max(1,vis.length-1)*(w-40),h-24-(p-mn)/Math.max(1e-9,mx-mn)*(h-48)];x.clearRect(0,0,w,h);line(x,vis.map((t,i)=>xy(i,+t.price)),'#ddd',1.5);let ms=Math.max(1,...vis.map(t=>+t.size||0));vis.forEach((t,i)=>{let q=xy(i,+t.price),r=2+Math.sqrt((+t.size||0)/ms)*8;x.beginPath();x.arc(q[0],q[1],r,0,Math.PI*2);x.fillStyle=t.aggressor==='BUY'?'rgba(75,211,155,.42)':t.aggressor==='SELL'?'rgba(255,116,116,.42)':'rgba(170,170,170,.3)';x.fill()});let buy=0,sell=0;vis.slice(-60).forEach(t=>t.aggressor==='BUY'?buy+=+t.size||0:t.aggressor==='SELL'?sell+=+t.size||0:0);$('replayInsight').innerHTML=`最近窗口：Buy ${OF.num(buy,0)} · Sell ${OF.num(sell,0)} · Delta <b class="${buy-sell>=0?'up':'dn'}">${OF.num(buy-sell,0)}</b>。Replay 保留“先发生什么、后发生什么”。`;$('replayQuality').textContent=quality()};$('replaySlider').oninput=e=>{OF.replayIndex=+e.target.value;OF.renderReplayView()};$('replayBack').onclick=()=>{OF.replayIndex=Math.max(0,OF.replayIndex-1);OF.renderReplayView()};$('replayNext').onclick=()=>{let a=OF.S.trades[OF.S.selected]||[];OF.replayIndex=Math.min(a.length-1,OF.replayIndex+1);OF.renderReplayView()};$('replayPlay').onclick=()=>{if(OF.replayTimer){clearInterval(OF.replayTimer);OF.replayTimer=null;$('replayPlay').textContent='PLAY';return}$('replayPlay').textContent='PAUSE';OF.replayTimer=setInterval(()=>{let a=OF.S.trades[OF.S.selected]||[];if(OF.replayIndex>=a.length-1){clearInterval(OF.replayTimer);OF.replayTimer=null;$('replayPlay').textContent='PLAY';return}OF.replayIndex++;OF.renderReplayView()},350)};OF.renderViews=()=>{let m=OF.latest(OF.S.selected,'metrics'),rec=OF.recommendView(m);$('viewRec').textContent=OF.VIEWS[rec[0]][0];$('viewWhy').textContent=rec[1];if(OF.C.view==='footprint')OF.renderFpView();else if(OF.C.view==='pressure')OF.renderPressureView();else if(OF.C.view==='cvd')OF.renderCvdView();else if(OF.C.view==='auction')OF.renderAuctionView();else if(OF.C.view==='replay'){if(!OF.replayIndex)OF.replayIndex=Math.max(0,(OF.S.trades[OF.S.selected]||[]).length-1);OF.renderReplayView()}};const base=OF.renderAll;OF.renderAll=()=>{base();OF.renderViews()};})();</script><script src="/static/flow-init.js"></script></body></html>
